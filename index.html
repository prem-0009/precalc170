const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnz=(a,b)=>{let x;do{x=ri(a,b)}while(x===0);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function fr(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+"/"+d}
const sg=(c,first)=>{ // signed term coefficient formatting helper
  if(first) return c<0?"− "+Math.abs(c):String(c); return c<0?" − "+Math.abs(c):" + "+c};
function lin(m,b,v="x"){ // m x + b
  let s=m===1?v:m===-1?"−"+v:N(m)+v; if(m===0)s=""; if(b!==0)s+= s?(b<0?" − "+(-b):" + "+b):String(b); return s||"0"}
function quad(a,b,c,v="x"){let s=(a===1?"":a===-1?"−":N(a))+v+"²";
  if(b)s+=(b<0?" − ":" + ")+(Math.abs(b)===1?"":Math.abs(b))+v; if(c)s+=(c<0?" − ":" + ")+Math.abs(c);return s}
function parseNum(s){s=String(s).trim().replace(/−/g,"-").replace(/\s+/g,"");
  if(/^[-+]?(inf|infinity|∞)$/i.test(s))return s[0]==="-"?-Infinity:Infinity;
  let m=s.match(/^([-+]?\d*\.?\d+)\/([-+]?\d*\.?\d+)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);
  if(/^[-+]?\d*\.?\d+$/.test(s))return parseFloat(s);
  m=s.match(/^([-+]?\d*)√(\d+)$/);if(m){const k=m[1]===""||m[1]==="+"?1:m[1]==="-"?-1:+m[1];return k*Math.sqrt(+m[2])}
  return NaN}
function numEq(a,b){if(!isFinite(a)||!isFinite(b))return a===b;return Math.abs(a-b)<1e-6*Math.max(1,Math.abs(b))+1e-9}
// intervals: "(-inf,3]U(5,inf)"
function parseIntervals(s){s=String(s).replace(/\s+/g,"").replace(/−/g,"-").replace(/∪/g,"U").replace(/u/g,"U").replace(/∞/g,"inf");
  if(/^(all|allreals|r|ℝ)$/i.test(s))s="(-inf,inf)";
  const parts=s.split("U");const out=[];
  for(const p of parts){const m=p.match(/^([\[\(])([^,]+),([^,\]\)]+)([\]\)])$/);if(!m)return null;
    const a=parseNum(m[2]),b=parseNum(m[3]);if(isNaN(a)||isNaN(b))return null;out.push([m[1],a,b,m[4]])}
  return out}
function intEq(u,k){const A=parseIntervals(u),B=parseIntervals(k);if(!A||!B||A.length!==B.length)return false;
  return A.every((x,i)=>x[0]===B[i][0]&&x[3]===B[i][3]&&numEq(x[1],B[i][1])&&numEq(x[2],B[i][2]))}
function check(q,ans){
  if(q.type==="mc")return ans===q.answer;
  if(q.type==="num"){const v=parseNum(ans);return !isNaN(v)&&numEq(v,parseNum(q.answer))}
  if(q.type==="interval")return intEq(ans,q.answer);
  if(q.type==="pair"){const a=String(ans).replace(/[()\s]/g,"").split(","),b=q.answer.replace(/[()\s]/g,"").split(",");
    return a.length===b.length&&a.every((x,i)=>numEq(parseNum(x),parseNum(b[i])))}
  return false}
// Multiple choice builder: correct + distractors (deduped)
// ===== Worked-solution helpers =====
const N=n=>String(n).replace(/-/g,"−");                       // true minus sign for display
const P=n=>{const s=String(n);return s[0]==="-"?"("+N(s)+")":N(s)}; // parenthesize negatives
const addT=b=>b===0?"":(b<0?" − ":" + ")+Math.abs(b);          // " + 5" / " − 5" / ""
const ST=terms=>terms.map(([c,b],i)=>{const a=Math.abs(c),m=b?(a+"·"+b):String(a);return i===0?(c<0?"−":"")+m:(c<0?" − ":" + ")+m}).join("");

  return `${nm}(${N(x)}) = ${ST(t)} = ${ST(v)} = ${N(a*x*x+b*x+c)}`};

const sol=(ask,rule,work,ans,chk)=>[`<b>What is being asked:</b> ${ask}`,`<b>Rule / idea:</b> ${rule}`,...work,`<b>Final answer:</b> ${ans}`,...(chk?[`<b>Quick check:</b> ${chk}`]:[])];
// Multiple choice builder: correct + distractors (deduped). why = array parallel to distractors, or {choice: reason}.
function mc(q,correct,distractors,steps,why,mistake){const ch=[correct],rs={};
  distractors.forEach((d,i)=>{if(!ch.includes(d)&&ch.length<4){ch.push(d);const r=Array.isArray(why)?why[i]:why&&why[d];if(r)rs[d]=r}});

()=>{const a=rnz(-4,4),b=ri(-5,5);const E=lin(a,b),ans=lin(a,a+b);

{id:"1.2",title:"Domain and Range",recap:[
"<b>Domain:</b> all allowed inputs. <b>Range:</b> all resulting outputs.",
"Exclude inputs that make a <b>denominator zero</b>. Require radicands of <b>even roots ≥ 0</b>.",
"Use <b>interval notation</b>: ( ) excludes, [ ] includes, ∞ always gets ( ). Join pieces with ∪.",
"Toolkit: x² has range [0,∞); √x domain [0,∞); 1/x domain and range (−∞,0)∪(0,∞)."],
gens:[
()=>{const a=ri(-9,9);const D=`x ${a<0?"+ "+(-a):"− "+a}`;const ans=`(-inf,${a})U(${a},inf)`;
  return itv(`Find the domain of f(x) = 1/(${D}). (Use interval notation.)`,ans,sol(
   `the domain (all allowed inputs) of f(x) = 1/(${D}), written in interval notation.`,
   `A fraction is not defined when its denominator is 0. So the domain is every real number EXCEPT the values that make the denominator equal to 0.`,
   [`Set the denominator equal to 0 to find the forbidden input: ${D} = 0.`,
    `Solve (${undo(-a)}): x = ${N(a)}.`,
    `So x = ${N(a)} is the only excluded input; every other real number is allowed.`,
    `Split the number line at ${N(a)}: the part to the left is (−∞, ${N(a)}) and the part to the right is (${N(a)}, ∞). Use parentheses at ${N(a)} because it is NOT included, and join the pieces with ∪.`],
   dI(ans),
   `At x = ${N(a)} the denominator is ${N(a)} − ${P(a)} = 0 (not defined ✗). At x = ${N(a+1)} the denominator is 1, so f = 1 (fine ✓).`),
   `Using a square bracket at ${N(a)}. A point excluded from the domain always gets a parenthesis. Also don't write the answer as just "x ≠ ${N(a)}" when interval notation is requested.`)},
()=>{const a=ri(-9,9);const D=`x ${a<0?"+ "+(-a):"− "+a}`;const ans=`[${a},inf)`;
  return itv(`Find the domain of f(x) = √(${D}).`,ans,sol(
   `the domain of f(x) = √(${D}) in interval notation.`,
   `An even root (like a square root) of a negative number is not a real number. So the expression under the root (the radicand) must be greater than or equal to 0.`,
   [`Write the condition: ${D} ≥ 0.`,
    `Solve the inequality (${undo(-a)}): x ≥ ${N(a)}.`,
    `x = ${N(a)} is allowed because √0 = 0 is a real number, so use a square bracket at ${N(a)}.`,
    `The inputs extend forever to the right, so the interval is [${N(a)}, ∞), with a parenthesis at ∞.`],
   dI(ans),
   `x = ${N(a)}: √0 = 0 ✓. x = ${N(a+1)}: √1 = 1 ✓. x = ${N(a-1)}: √(−1) is not real ✗.`),
   `Using a parenthesis at ${N(a)}. For √ the radicand may equal 0, so the endpoint IS included (bracket).`)},
()=>{const a=ri(-8,8),k=ri(2,4);const lim=fr(a,k);const f0=Math.floor(a/k);const t1=f0-1,t2=f0+1;const ans=`(-inf,${lim}]`;
  return itv(`Find the domain of f(x) = √(${a} − ${k}x).`,ans,sol(
   `the domain of f(x) = √(${a} − ${k}x) in interval notation.`,
   `The radicand of a square root must be ≥ 0. Solve that inequality; remember that multiplying or dividing an inequality by a NEGATIVE number reverses the inequality sign.`,
   [`Write the condition: ${N(a)} − ${k}x ≥ 0.`,
    `${a===0?"The constant is 0 already":`Subtract ${N(a)} from both sides`}: ${N(-k)}x ≥ ${N(-a)}.`,
    `Divide both sides by ${N(-k)}, which is negative, so flip the inequality: x ≤ ${N(-a)} ÷ ${P(-k)} = ${N(lim)}.`,
    `Include the endpoint (≥ 0 allows 0 under the root), so use a bracket at ${N(lim)}; the interval runs to the left forever.`],
   dI(ans),
   `x = ${N(t1)}: ${N(a)} − ${k}·${P(t1)} = ${N(a-k*t1)} ≥ 0 ✓ allowed. x = ${N(t2)}: ${N(a)} − ${k}·${P(t2)} = ${N(a-k*t2)} &lt; 0 ✗ not allowed.`),
   `Forgetting to flip the inequality when dividing by ${N(-k)}. That would wrongly give x ≥ ${N(lim)}.`)},
()=>{const r=ri(1,7);const ans=`(-inf,${-r})U(${-r},${r})U(${r},inf)`;
  return itv(`Find the domain of f(x) = (x + 1)/(x² − ${r*r}).`,ans,sol(
   `the domain of f(x) = (x + 1)/(x² − ${r*r}) in interval notation.`,
   `Only the DENOMINATOR matters for division by zero: exclude every x that makes x² − ${r*r} equal to 0. Use the difference of squares a² − b² = (a − b)(a + b) to find them.`,
   [`Set the denominator equal to 0: x² − ${r*r} = 0.`,
    `Factor as a difference of squares: (x − ${r})(x + ${r}) = 0.`,
    `Zero-product property: x − ${r} = 0 or x + ${r} = 0, so x = ${r} or x = −${r}.`,
    `Exclude both values. They split the number line into three pieces: (−∞, −${r}), (−${r}, ${r}), (${r}, ∞).`,
    `Join the pieces with ∪ (parentheses at the excluded points).`],
   dI(ans),
   `x = ${r}: ${r}² − ${r*r} = 0 ✗. x = −${r}: (−${r})² − ${r*r} = 0 ✗. x = 0: 0 − ${r*r} = −${r*r} ≠ 0 ✓ allowed.`),
   `Excluding the zero of the numerator (x = −1). A numerator of 0 is fine (the fraction is just 0); only a zero denominator is forbidden.`)},
()=>{const k=ri(-9,9);const ans=`[${k},inf)`;
  return itv(`Find the range of f(x) = x² ${k<0?"− "+(-k):"+ "+k}.`,ans,sol(
   `the range (all possible outputs) of f(x) = x² ${k<0?"− "+(-k):"+ "+k}, in interval notation.`,
   `Squaring any real number gives a result ≥ 0, and the smallest square is 0 (at x = 0). Adding a constant shifts every output by that constant.`,
   [`Start with the fact: x² ≥ 0 for every real x.`,
    `Add ${N(k)} to both sides: x² ${k<0?"−":"+"} ${Math.abs(k)} ≥ 0 ${k<0?"−":"+"} ${Math.abs(k)} = ${N(k)}.`,
    `So every output is at least ${N(k)}.`,
    `The value ${N(k)} is reached when x = 0 (f(0) = ${N(k)}), so use a bracket; as |x| grows the outputs grow without bound, so the interval extends to ∞.`],
   dI(ans),
   `f(0) = ${N(k)} ✓ is the lowest output. f(3) = 9 ${k<0?"−":"+"} ${Math.abs(k)} = ${N(9+k)} is higher ✓.`),
   `Mixing up domain and range. The domain here is all real numbers; the range describes the OUTPUTS, and the lowest one is ${N(k)}.`)},
()=>{const k=ri(-9,9);const ans=`(-inf,${k}]`;
  return itv(`Find the range of f(x) = −|x| ${k<0?"− "+(-k):"+ "+k}.`,ans,sol(
   `the range of f(x) = −|x| ${k<0?"− "+(-k):"+ "+k} in interval notation.`,
   `|x| is never negative, so −|x| is never positive: it is at most 0. Adding the constant shifts every output by that amount.`,
   [`Start with |x| ≥ 0 for every real x.`,
    `Multiply both sides by −1, which reverses the inequality: −|x| ≤ 0.`,
    `Add ${N(k)}: −|x| ${k<0?"−":"+"} ${Math.abs(k)} ≤ 0 ${k<0?"−":"+"} ${Math.abs(k)} = ${N(k)}.`,
    `The maximum ${N(k)} is reached at x = 0, so use a bracket at ${N(k)}; outputs decrease forever, so the interval goes to −∞.`],
   dI(ans),
   `f(0) = −0 ${k<0?"−":"+"} ${Math.abs(k)} = ${N(k)} (the top) ✓. f(2) = −2 ${k<0?"−":"+"} ${Math.abs(k)} = ${N(-2+k)} is lower ✓.`),
   `Forgetting the negative sign in front of |x|: that flips the graph upside down, so outputs have a MAXIMUM, not a minimum.`)},
()=>{const a=ri(-6,2),b=a+ri(1,8),lc=Math.random()<.5,rc=Math.random()<.5;const ineq=`${a} ${lc?"≤":"<"} x ${rc?"≤":"<"} ${b}`;const ans=iv(a,b,lc,rc);
  return itv(`Write the inequality ${ineq} in interval notation.`,ans,sol(
   `the inequality ${ineq} written as an interval.`,
   `In interval notation, a parenthesis ( ) means the endpoint is NOT included (strict inequality &lt; or &gt;), and a square bracket [ ] means it IS included (≤ or ≥). The smaller number is written first.`,
   [`Read the inequality as "x is between ${N(a)} and ${N(b)}".`,
    `Left end: ${N(a)} ${lc?"≤":"&lt;"} x. The symbol ${lc?"≤":"&lt;"} ${lc?"includes":"does not include"} ${N(a)}, so use "${lc?"[":"("}".`,
    `Right end: x ${rc?"≤":"&lt;"} ${N(b)}. The symbol ${rc?"≤":"&lt;"} ${rc?"includes":"does not include"} ${N(b)}, so use "${rc?"]":")"}".`,
    `Write the lower endpoint, a comma, then the upper endpoint.`],
   dI(ans),
   `x = ${N(a)} is ${lc?"":"NOT "}allowed and x = ${N(b)} is ${rc?"":"NOT "}allowed by the original inequality; the brackets match that ✓.`),
   `Using a bracket with a strict inequality (or the reverse). Strict &lt; means open: use a parenthesis.`)},
()=>{const a=ri(-5,5);const D=`x ${a<0?"+ "+(-a):"− "+a}`;const ans=`(${a},inf)`;
  return itv(`Find the domain of f(x) = 1/√(${D}).`,ans,sol(
   `the domain of f(x) = 1/√(${D}) in interval notation.`,
   `Two restrictions apply at once: (1) the radicand must be ≥ 0 for the square root to be real, and (2) the denominator √(…) must NOT be 0. Together the radicand must be strictly greater than 0.`,
   [`Restriction 1: ${D} ≥ 0.`,
    `Restriction 2: √(${D}) ≠ 0, which means ${D} ≠ 0.`,
    `Combine them: ${D} &gt; 0.`,
    `Solve (${undo(-a)}): x &gt; ${N(a)}.`,
    `The endpoint ${N(a)} is excluded, so use a parenthesis: (${N(a)}, ∞).`],
   dI(ans),
   `x = ${N(a)}: 1/√0 is not defined ✗. x = ${N(a+1)}: 1/√1 = 1 ✓. x = ${N(a-1)}: 1/√(−1) is not real ✗.`),
   `Using a bracket at ${N(a)} (as for √ alone). The square root is also in the denominator, so ${N(a)} would make the denominator 0 and must be excluded.`)},
fixed("What is the domain of f(x) = ∛x (cube root)?","the set of all inputs for which the cube root ∛x is a real number.","(−∞, ∞)",["[0, ∞)","(0, ∞)","(−∞, 0]"],
  ["Wrong — that restriction is for SQUARE roots. Cube roots accept negative inputs.","Wrong — 0 is allowed (∛0 = 0) and negatives are too.","Wrong — positive inputs have cube roots too (∛8 = 2)."],
  `Even roots (square, fourth, …) need a radicand ≥ 0. Odd roots (cube, fifth, …) are defined for every real number.`,
  [`Test a positive input: ∛8 = 2 because 2³ = 8.`,`Test zero: ∛0 = 0.`,`Test a negative input: ∛(−8) = −2 because (−2)³ = −8. It works!`,`No real number causes trouble, so all real numbers are allowed.`],
  `Every real number y has a real cube root, since x³ takes every real value ✓.`),
fixed("What is the range of f(x) = 1/x?","all possible output values of f(x) = 1/x.","(−∞, 0) ∪ (0, ∞)",["(−∞, ∞)","[0, ∞)","(0, ∞)"],
  ["Wrong — 0 is not an output: no input makes 1/x equal 0.","Wrong — this includes 0 and leaves out negative outputs; 1/(−2) = −0.5 is an output.","Wrong — negative inputs give negative outputs, so negatives are in the range."],
  `The range is every y for which the equation y = 1/x has a solution x. Solve for x: x = 1/y, which exists whenever y ≠ 0.`,
  [`Set y = 1/x and solve for x: multiply both sides by x to get xy = 1, then divide by y: x = 1/y.`,`This works for every y except y = 0 (division by zero).`,`Can the output be 0? 1/x = 0 would need 1 = 0, which is impossible, so 0 is not an output.`,`All nonzero numbers are outputs (e.g. 1/(1/5) = 5, 1/(−1/5) = −5), so the range is (−∞, 0) ∪ (0, ∞).`],
  `1/x gets very close to 0 for huge x but never equals it ✓.`),
fixed("Which bracket is always used next to ∞?","which kind of bracket belongs next to ∞ in interval notation.","Parenthesis ( )",["Square bracket [ ]","Either one","Curly brace { }"],
  ["Wrong — a square bracket means the endpoint is included, but ∞ is not a number you can include.","Wrong — only parentheses are correct, because ∞ is never reached.","Wrong — curly braces are used for sets, not interval notation."],
  `Brackets [ ] include their endpoint; parentheses ( ) exclude it. The infinity symbol is not a real number, so it can never be an included endpoint.`,

// ===== Progress export/import =====
function encodeProgress(state){const j=JSON.stringify({v:1,s:state});return btoa(unescape(encodeURIComponent(j)))}
function validState(s){if(!s||typeof s!=="object")return false;
  if(!s.hist||typeof s.hist!=="object"||!s.mastered||typeof s.mastered!=="object")return false;
  const ids=SECTIONS.map(x=>x.id);if(!ids.includes(s.cur))return false;
  for(const k in s.hist){if(!ids.includes(k)||!Array.isArray(s.hist[k])||!s.hist[k].every(b=>typeof b==="boolean"))return false}
  for(const k in s.mastered){if(!ids.includes(k)||typeof s.mastered[k]!=="boolean")return false}
  if(s.skipped!==undefined){if(!s.skipped||typeof s.skipped!=="object")return false;for(const k in s.skipped){if(!ids.includes(k)||typeof s.skipped[k]!=="boolean")return false}}
  return true}
function decodeProgress(code){try{const t=String(code).replace(/\s+/g,"");if(!/^[A-Za-z0-9+/=]+$/.test(t))return null;
  const o=JSON.parse(decodeURIComponent(escape(atob(t))));if(!o||o.v!==1||!validState(o.s))return null;
  const s=o.s;return {hist:s.hist,mastered:s.mastered,skipped:s.skipped||{},cur:s.cur,count:typeof s.count==="number"?s.count:0,updatedAt:typeof s.updatedAt==="number"?s.updatedAt:0}}catch(e){return null}}
// ===== Manual mastery (skip) / undo =====
function markMastered(st,id){const ix=SECTIONS.findIndex(s=>s.id===id);if(ix<0)return st;
  const n={...st,mastered:{...st.mastered},skipped:{...(st.skipped||{})}};
  for(let i=0;i<=ix;i++){const k=SECTIONS[i].id;if(!n.mastered[k]){n.mastered[k]=true;n.skipped[k]=true}}
  if(ix<SECTIONS.length-1&&n.cur===id)n.cur=SECTIONS[ix+1].id;return n}
function unmarkMastered(st,id){const ix=SECTIONS.findIndex(s=>s.id===id);if(ix<0)return st;
  const n={...st,mastered:{...st.mastered},skipped:{...(st.skipped||{})}};
  for(let i=ix;i<SECTIONS.length;i++){const k=SECTIONS[i].id;delete n.mastered[k];delete n.skipped[k]}
  const ci=SECTIONS.findIndex(s=>s.id===n.cur);if(ci>ix)n.cur=id;return n}
// ===== Sync conflict rule: last-write-wins by updatedAt (ms) =====
function pickNewer(local,remote){const lv=local&&validState(local),rv=remote&&validState(remote);
  if(!rv)return {state:local,source:"local"};if(!lv)return {state:remote,source:"remote"};
  const lt=+local.updatedAt||0,rt=+remote.updatedAt||0;return rt>lt?{state:remote,source:"remote"}:{state:local,source:"local"}}
if(typeof module!=="undefined")module.exports={markMastered,unmarkMastered,pickNewer,SECTIONS,check,parseNum,intEq,parseIntervals,encodeProgress,decodeProgress};

const KEY="precalc170_ch1_v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{hist:{},mastered:{},cur:"1.1",count:0};
let pushTimer=null;
function save(touch=true){if(touch)S.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));
  if(window.CLOUD&&CLOUD.user){clearTimeout(pushTimer);pushTimer=setTimeout(()=>CLOUD.push(S),800)}}
const $=id=>document.getElementById(id);
const unlocked=i=>i===0||S.mastered[SECTIONS[i-1].id];
function isMastered(h){if(h.length<10)return false;const l=h.slice(-10);if(l.filter(Boolean).length<8)return false;return l.slice(-3).every(Boolean)}
let curQ=null,curSec=null,isReview=false,answered=false,lastIdx={};
function renderMap(){$("map").innerHTML=SECTIONS.map((s,i)=>{const h=S.hist[s.id]||[],l=h.slice(-10),c=l.filter(Boolean).length;
 const st=S.mastered[s.id]?"done":unlocked(i)?"open":"locked";const sk=S.skipped&&S.skipped[s.id];
 return `<div class="nwrap"><button class="node ${st} ${S.cur===s.id?"cur":""}" ${st==="locked"?"disabled":""} onclick="go('${s.id}')"><span class="sid">${st==="done"?"✓":st==="locked"?"🔒":s.id}</span><span class="st">${s.id} ${s.title}${sk?' <em class="skp">(skipped)</em>':""}</span><span class="bar"><i style="width:${S.mastered[s.id]?100:c*10}%"></i></span></button>`+
  (S.mastered[s.id]?`<button class="mini" onclick="undoMaster('${s.id}')">↩︎ Undo mastered</button>`:`<button class="mini" onclick="skipTo('${s.id}')">⏭ Mark as mastered</button>`)+`</div>`}).join("")}
function skipTo(id){const ix=SECTIONS.findIndex(s=>s.id===id);const earlier=SECTIONS.slice(0,ix).filter(s=>!S.mastered[s.id]).map(s=>s.id);
 if(!confirm(`Mark ${id} as mastered${earlier.length?" (and "+earlier.join(", ")+")":""}? It will unlock the next section. Skipped sections still appear in spaced review.`))return;
 S=markMastered(S,id);save();go(S.cur)}
function undoMaster(id){const later=SECTIONS.slice(SECTIONS.findIndex(s=>s.id===id)+1).filter(s=>S.mastered[s.id]).map(s=>s.id);
 if(!confirm(`Unmark ${id} as mastered${later.length?" (later sections "+later.join(", ")+" will be unmarked too, to keep the order)":""}?`))return;
 S=unmarkMastered(S,id);save();go(S.cur)}
function go(id){S.cur=id;save();renderMap();showRecap();next()}
function showRecap(){const s=SECTIONS.find(x=>x.id===S.cur);$("recap").open=false;$("recap").innerHTML=`<summary>📘 Concept recap: ${s.id} ${s.title} <span class="hint"><span class="show">tap to show ▸</span><span class="hide">tap to hide ▾</span></span></summary><ul>${s.recap.map(r=>"<li>"+r+"</li>").join("")}</ul>`}
function pickQ(sec){const n=sec.gens.length;let i;do{i=Math.floor(Math.random()*n)}while(n>1&&i===lastIdx[sec.id]);lastIdx[sec.id]=i;return sec.gens[i]()}
function next(){answered=false;S.count++;const done=SECTIONS.filter(s=>S.mastered[s.id]&&s.id!==S.cur);
 isReview=done.length>0&&Math.random()<0.25;curSec=isReview?pick(done):SECTIONS.find(x=>x.id===S.cur);curQ=pickQ(curSec);
 const h=S.hist[S.cur]||[];const l=h.slice(-10);
 $("status").innerHTML=isReview?`<span class="tag rv">🔁 Spaced review: ${curSec.id} ${curSec.title}</span>`:`<span class="tag">${curSec.id} ${curSec.title}</span> <span class="small">Last 10: ${l.map(x=>x?"🟢":"🔴").join("")||"—"} (need 8/10 + last 3 correct)</span>`;
 let html=`<div class="q">${curQ.q}</div>`;
 if(curQ.type==="mc")html+=curQ.choices.map((c,i)=>`<button class="ch" onclick="submit(${i})">${c}</button>`).join("");
 else html+=`<input id="ans" autocomplete="off" placeholder="${curQ.hint||""}" onkeydown="if(event.key==='Enter')submit()"><div class="small">${curQ.hint||""}</div><button class="go" onclick="submit()">Check</button>`;
 $("card").innerHTML=html;$("fb").innerHTML="";const a=$("ans");if(a)a.focus();save()}
function submit(i){if(answered)return;const ans=curQ.type==="mc"?i:$("ans").value;if(curQ.type!=="mc"&&!String(ans).trim())return;answered=true;
 const ok=check(curQ,ans);const right=curQ.type==="mc"?curQ.choices[curQ.answer]:curQ.answer.replace(/inf/g,"∞").replace(/U/g," ∪ ");
 if(curQ.type==="mc")document.querySelectorAll(".ch").forEach((b,j)=>{b.disabled=true;if(j===curQ.answer)b.classList.add("good");else if(j===i)b.classList.add("bad")});else $("ans").disabled=true;
 let msg="";if(isReview){const h=S.hist[curSec.id]=S.hist[curSec.id]||[];h.push(ok);}
 else{const h=S.hist[S.cur]=S.hist[S.cur]||[];h.push(ok);if(h.length>50)h.shift();
  if(!S.mastered[S.cur]&&isMastered(h)){S.mastered[S.cur]=true;const ix=SECTIONS.findIndex(s=>s.id===S.cur);msg=ix<SECTIONS.length-1?`<div class="win">🎉 ${S.cur} mastered! ${SECTIONS[ix+1].id} unlocked.</div>`:`<div class="win">🏆 Chapter 1 complete! Keep practicing for review.</div>`}}
 const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 const mine=curQ.type==="mc"?curQ.choices[i]:String(ans).trim();
 const why=curQ.why||[];const myWhy=!ok&&curQ.type==="mc"?why.find(w=>w.c===mine):null;
 const wrongBlock=ok?"":`<div class="yours">Your answer: <b>${curQ.type==="mc"?mine:esc(mine)}</b></div>${myWhy?`<div class="mist">❌ <b>Why your choice is wrong:</b><br>${myWhy.r.replace(/^Wrong — /,"")}</div>`:""}${curQ.mistake?`<div class="mist">⚠️ <b>Common mistake:</b><br>${curQ.mistake}</div>`:""}`;
 const okMistake=ok&&curQ.mistake?`<details class="mistd"><summary>⚠️ Common mistake to avoid</summary>${curQ.mistake}</details>`:"";
 const whyAll=curQ.type==="mc"&&why.length?`<div class="whyall"><b>Why the other choices are wrong</b><ul>${why.map(w=>`<li><b>${w.c}</b><br>${w.r.replace(/^Wrong — /,"")}</li>`).join("")}</ul></div>`:"";
 $("fb").innerHTML=`<div class="${ok?"okb":"nob"}">${ok?"✅ Correct!":"❌ Not quite. Correct answer: <b>"+right+"</b>"}</div>${wrongBlock}<div class="steps"><b>Worked solution</b><ol>${curQ.steps.map(s=>"<li>"+s+"</li>").join("")}</ol></div>${okMistake}${whyAll}${msg}<button class="go" onclick="${msg&&SECTIONS.findIndex(s=>s.id===S.cur)<SECTIONS.length-1?`go(SECTIONS[SECTIONS.findIndex(s=>s.id===S.cur)+1].id)`:"next()"}">Next →</button>`;
 save();renderMap();if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise().catch(()=>{})}
function resetAll(){if(confirm("Reset all progress?")){localStorage.removeItem(KEY);S={hist:{},mastered:{},cur:"1.1",count:0};go("1.1")}}
go(S.cur);

// ===== Cloud sync (Supabase Auth + Postgres), optional =====
function setSyncMsg(t){const e=$("syncMsg");if(e)e.textContent=t}
async function loadSupabase(){for(const u of["https://esm.sh/@supabase/supabase-js@2","https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"]){try{const m=await import(u);if(m.createClient)return m}catch(e){}}return null}
async function initCloud(){const cfg=window.SB_CONFIG;if(!cfg||!cfg.url){setSyncMsg("Cloud sync not configured — progress saved on this device only.");return}
  if(!navigator.onLine)setSyncMsg("Offline — progress saved on this device.");
  const m=await loadSupabase();if(!m){setSyncMsg("Cloud sync unavailable (offline?) — progress saved on this device.");return}
  const sb=m.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:"precalc170-auth"}});
  window.CLOUD={user:null,sb,
    push:async st=>{if(!CLOUD.user)return;const{error}=await sb.from("progress").upsert({user_id:CLOUD.user.id,state:st,updated_at:st.updatedAt||0});
      setSyncMsg(error?"⚠️ Sync failed ("+(error.message||"offline")+") — will retry on next answer.":"☁️ Synced "+new Date().toLocaleTimeString())},
    pull:async()=>{const{data,error}=await sb.from("progress").select("state,updated_at").eq("user_id",CLOUD.user.id).maybeSingle();if(error)throw error;
      if(!data)return null;const s=data.state;if(s&&typeof s==="object")s.updatedAt=+data.updated_at||s.updatedAt||0;return s}};
  let lastUid=null;
  sb.auth.onAuthStateChange((ev,session)=>{const u=session&&session.user||null;CLOUD.user=u;renderAuth();
    if(u)cleanAuthUrl();
    if(ev==="PASSWORD_RECOVERY")setTimeout(async()=>{const p=prompt("Enter a new password (6+ characters):");if(p){const{error}=await sb.auth.updateUser({password:p});setSyncMsg(error?"❌ "+error.message:"✅ Password updated.")}},0);
    if(!u){lastUid=null;return}if(u.id===lastUid)return;lastUid=u.id;setTimeout(syncOnLogin,0)});
  authErrorFromUrl();
  // Retry pending upload when connection returns / app regains focus (iOS)
  window.addEventListener("online",()=>CLOUD.user&&CLOUD.push(S));
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&CLOUD.user)syncOnLogin()});
}
function cleanAuthUrl(){ // remove OAuth/confirm tokens (#access_token=… or ?code=…) from the address bar
  const h=location.hash,qs=new URLSearchParams(location.search);
  if(/access_token|refresh_token|error_description|type=/.test(h)||qs.has("code")||qs.has("error")){
    ["code","error","error_code","error_description"].forEach(k=>qs.delete(k));const q=qs.toString();
    history.replaceState(null,"",location.pathname+(q?"?"+q:""))}}
function authErrorFromUrl(){const p=new URLSearchParams(location.hash.slice(1)+"&"+location.search.slice(1));const d=p.get("error_description");
  if(d){setSyncMsg("❌ Sign-in failed: "+d.replace(/\+/g," "));cleanAuthUrl()}}
async function magicLink(){if(!window.CLOUD)return setSyncMsg("Cloud sync not available right now.");
  const e=$("authEmail").value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return setSyncMsg("Enter your email above first.");
  setSyncMsg("Sending link…");const{error}=await CLOUD.sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});
  setSyncMsg(error?"❌ "+error.message:"📧 Sign-in link sent to "+e+". On iPhone, long-press the link and choose Open in Safari.")}
async function setPassword(){const p=$("newPass").value,p2=$("newPass2").value;
  if(p.length<8)return setSyncMsg("Password must be at least 8 characters.");if(p!==p2)return setSyncMsg("Passwords don't match.");
  setSyncMsg("Saving password…");const{error}=await CLOUD.sb.auth.updateUser({password:p});
  if(error)return setSyncMsg("❌ "+error.message);$("newPass").value=$("newPass2").value="";$("pwSet").open=false;
  setSyncMsg("✅ Password saved. Use your email + this password to sign in on your other devices.")}
async function syncOnLogin(){setSyncMsg("Loading cloud progress…");
  try{const remote=await CLOUD.pull();const r=pickNewer(S,remote);
    if(r.source==="remote"){S=r.state;save(false);go(S.cur);setSyncMsg("☁️ Loaded newer progress from cloud.")}else await CLOUD.push(S)}
  catch(e){setSyncMsg("⚠️ Couldn't reach cloud ("+(e.message||e)+"); using this device's progress.")}}
function renderAuth(){const u=window.CLOUD&&CLOUD.user;$("authOut").hidden=!!u;$("authIn").hidden=!u;if(u)$("authWho").textContent=u.email;
  const b=$("authBadge");b.textContent=u?"Signed in":"Signed out";b.classList.toggle("on",!!u)}
function toggleMenu(open){const m=$("menu");if(open===undefined)open=m.hidden;if(open)m.style.top=(document.querySelector("header").getBoundingClientRect().bottom+6)+"px";m.hidden=!open;$("menuBack").hidden=!open;$("menuBtn").setAttribute("aria-expanded",open)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")toggleMenu(false)});
const MKEY="precalc170_manage";
function setManage(on){document.body.classList.toggle("manage",on);localStorage.setItem(MKEY,on?"1":"0");$("manageTog").checked=on}
setManage(localStorage.getItem(MKEY)==="1");
async function authDo(kind){if(!window.CLOUD)return setSyncMsg("Cloud sync not available right now.");
  const e=$("authEmail").value.trim(),p=$("authPass").value,sb=CLOUD.sb,here=location.origin+location.pathname;let r;
  if(!e)return setSyncMsg("Enter your email.");
  if(kind==="reset"){r=await sb.auth.resetPasswordForEmail(e,{redirectTo:here});return setSyncMsg(r.error?"❌ "+r.error.message:"📧 Password reset email sent.")}
  if(!p)return setSyncMsg("Enter your password.");if(kind==="up"&&p.length<8)return setSyncMsg("Choose a password with at least 8 characters.");
  r=kind==="up"?await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:here}}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error)return setSyncMsg("❌ "+r.error.message);$("authPass").value="";
  if(kind==="up"&&!r.data.session)setSyncMsg("📧 Account created. Check your email and tap the confirmation link, then sign in.")}
async function signOutCloud(){if(window.CLOUD){await CLOUD.sb.auth.signOut();setSyncMsg("Signed out. Progress stays on this device.")}}
initCloud();
